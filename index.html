<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双十一特别祝福</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 背景装饰 */
        .bg-decoration {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .floating-heart {
            position: absolute;
            font-size: 20px;
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* 输入界面 */
        .input-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            z-index: 10;
            animation: slideIn 0.5s ease-out;
            max-width: 400px;
            width: 90%;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-container h2 {
            color: #764ba2;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .name-input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #667eea;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s;
        }

        .name-input:focus {
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.3);
        }

        .submit-btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* 便签界面容器 */
        .note-wrapper {
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            animation: wrapperAppear 0.8s ease-out;
        }

        @keyframes wrapperAppear {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 表情包容器 */
        .meme-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            text-align: center;
            animation: memeSlideIn 0.6s ease-out 0.2s both;
        }

        @keyframes memeSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .meme-image {
            width: 200px;
            height: auto;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .meme-text {
            font-size: 14px;
            color: #666;
            font-style: italic;
        }

        /* 便签界面 */
        .note-container {
            background: #fff8e1;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            position: relative;
            max-width: 500px;
            width: 90%;
            z-index: 10;
            transform: rotate(-2deg);
            animation: noteAppear 0.8s ease-out 0.4s both;
        }

        @keyframes noteAppear {
            from {
                opacity: 0;
                transform: rotate(-2deg) scale(0.8);
            }
            to {
                opacity: 1;
                transform: rotate(-2deg) scale(1);
            }
        }

        .note-container::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 20px;
            background: rgba(255, 193, 7, 0.6);
            border-radius: 10px;
        }

        .note-text {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            line-height: 2;
            font-size: 20px;
            color: #333;
        }

        .note-line {
            margin: 10px 0;
            opacity: 0;
            animation: fadeInLine 0.5s ease-out forwards;
        }

        @keyframes fadeInLine {
            to {
                opacity: 1;
            }
        }

        .note-line:nth-child(1) { animation-delay: 0.6s; }
        .note-line:nth-child(2) { animation-delay: 0.8s; }
        .note-line:nth-child(3) { animation-delay: 1.0s; }
        .note-line:nth-child(4) { animation-delay: 1.2s; }
        .note-line:nth-child(5) { animation-delay: 1.4s; }
        .note-line:nth-child(6) { animation-delay: 1.6s; }

        .color-blue { color: #2196F3; }
        .color-green { color: #4CAF50; }
        .color-red { color: #f44336; }
        .color-orange { color: #FF9800; }
        .color-purple { color: #9C27B0; }
        .color-pink { color: #E91E63; }
        .color-darkred { color: #b71c1c; font-weight: bold; }

        .restart-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #764ba2;
            border-radius: 20px;
            color: #764ba2;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 20;
            display: none;
        }

        .restart-btn:hover {
            background: #764ba2;
            color: white;
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .note-container {
                padding: 30px;
                font-size: 18px;
            }
            
            .input-container {
                padding: 30px 20px;
            }

            .meme-image {
                width: 150px;
            }

            .note-wrapper {
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景装饰 -->
    <div class="bg-decoration" id="bgDecoration"></div>

    <!-- 输入界面 -->
    <div class="input-container" id="inputContainer">
        <h2>🎉 双十一特别祝福 🎉</h2>
        <p style="margin-bottom: 20px; color: #666;">请输入你的姓名，接收专属祝福</p>
        <input type="text" class="name-input" id="nameInput" placeholder="请输入你的姓名" maxlength="10">
        <button class="submit-btn" onclick="showNote()">查看祝福</button>
    </div>

    <!-- 便签界面容器 -->
    <div class="note-wrapper" id="noteWrapper">
        <!-- 表情包 -->
        <div class="meme-container">
            <img src="1111.jpg" alt="禁止恋爱表情包" class="1111-image">
            <div class="meme-text">光棍节专享提醒</div>
        </div>

        <!-- 便签 -->
        <div class="note-container" id="noteContainer">
            <div class="note-text">
                <div class="note-line">
                    <span style="color: #333;">To:</span> <span class="color-blue" id="userName"></span>
                </div>
                <div class="note-line">
                    <span class="color-blue">今天</span>就是<span class="color-green">11月11日</span>了
                </div>
                <div class="note-line">
                    也是<span class="color-red">光棍节</span>
                </div>
                <div class="note-line">
                    <span class="color-darkred">有对象的帅哥美女不许秀恩爱</span>
                </div>
                <div class="note-line">
                    <span class="color-purple">希望</span>我没对象的<span class="color-pink">好朋友</span>
                </div>
                <div class="note-line">
                    <span class="color-blue">明年</span><span style="color: #333;">还</span><span class="color-orange">单身</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 重新开始按钮 -->
    <button class="restart-btn" id="restartBtn" onclick="restart()">重新开始</button>

    <script>
        // 创建背景装饰
        function createBackgroundDecoration() {
            const bgDecoration = document.getElementById('bgDecoration');
            const hearts = ['❤️', '💕', '💖', '💗', '💝', '💔', '😂', '🎉'];
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#f0932b'];
            
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.top = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 6 + 's';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                bgDecoration.appendChild(heart);
            }
        }

        // 显示便签
        function showNote() {
            const nameInput = document.getElementById('nameInput');
            const name = nameInput.value.trim();
            
            if (!name) {
                // 输入框抖动效果
                nameInput.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    nameInput.style.animation = '';
                }, 500);
                return;
            }
            
            // 设置用户名
            document.getElementById('userName').textContent = name;
            
            // 切换界面
            document.getElementById('inputContainer').style.display = 'none';
            document.getElementById('noteWrapper').style.display = 'flex';
            document.getElementById('restartBtn').style.display = 'block';
            
            // 添加庆祝效果
            createConfetti();
        }

        // 重新开始
        function restart() {
            document.getElementById('inputContainer').style.display = 'block';
            document.getElementById('noteWrapper').style.display = 'none';
            document.getElementById('restartBtn').style.display = 'none';
            document.getElementById('nameInput').value = '';
        }

        // 创建彩纸效果
        function createConfetti() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#f0932b', '#eb4d4b', '#6ab04c'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'fixed';
                    confetti.style.width = '10px';
                    confetti.style.height = '10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.borderRadius = '50%';
                    confetti.style.zIndex = '1000';
                    confetti.style.pointerEvents = 'none';
                    document.body.appendChild(confetti);
                    
                    // 动画
                    let posY = -10;
                    let posX = parseFloat(confetti.style.left);
                    let velocityY = Math.random() * 3 + 2;
                    let velocityX = (Math.random() - 0.5) * 2;
                    let rotation = Math.random() * 360;
                    let rotationSpeed = (Math.random() - 0.5) * 10;
                    
                    const animate = () => {
                        posY += velocityY;
                        posX += velocityX;
                        rotation += rotationSpeed;
                        velocityY += 0.1; // 重力
                        
                        confetti.style.top = posY + 'px';
                        confetti.style.left = posX + '%';
                        confetti.style.transform = `rotate(${rotation}deg)`;
                        confetti.style.opacity = Math.max(0, 1 - posY / window.innerHeight);
                        
                        if (posY < window.innerHeight) {
                            requestAnimationFrame(animate);
                        } else {
                            confetti.remove();
                        }
                    };
                    
                    requestAnimationFrame(animate);
                }, i * 30);
            }
        }

        // 添加抖动动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);

        // 回车键提交
        document.getElementById('nameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                showNote();
            }
        });

        // 初始化
        createBackgroundDecoration();
    </script>
</body>
</html>
